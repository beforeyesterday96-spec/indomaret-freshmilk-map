  h+=`<div class="bar"><input id="q" placeholder="Cari kode / nama / alamat…" value="${esc(S.q)}">`+opt(Object.entries(cnt(T,t=>t.cab)),"cab","Semua cabang")+opt(Object.entries(cnt(T,t=>t.kab)).sort(),"kab","Semua kabupaten")+
   `<select data-s="sup"><option value="">Semua supplier</option>${[...new Set(Object.values(m).map(v=>v[0]))].map(i=>`<option value="${i}" ${S.sup==i?"selected":""}>${esc(D.supp[i].kode)} · ${i}</option>`).join("")}</select>`+
   `<select data-s="pt"><option value="">Semua price type</option>${[...new Set(Object.values(m).map(v=>v[1]))].sort((a,b)=>a-b).map(p=>`<option value="${p}" ${S.pt==p?"selected":""}>Type ${p}${p==3?" (reguler)":p==31?" (wilayah jauh)":p==32||p==33?" (wilayah jauh luar kota)":""}</option>`).join("")}</select>`+
   `<select data-s="mp"><option value="">Mapping: semua</option><option value="m" ${S.mp==="m"?"selected":""}>Sudah termapping</option><option value="b" ${S.mp==="b"?"selected":""}>Belum termapping</option><option value="y" ${S.mp==="y"?"selected":""}>Sudah di Excel</option><option value="n" ${S.mp==="n"?"selected":""}>Usulan (belum di Excel)</option></select></div>`;
  const D2=[["Gudang","gd"],["Tgl buka","buka"],["AS","as"],["AM","am"],["Kecamatan","kec"],["Kelurahan","kel"],["Kode pos","pos"],["Jarak DC","jarak"],["Domain","dom"],["Subdomain","sub"],["Socio class","soc"],["Matrix","mx"],["Tipe toko","tp"],["24 jam","h24"],["Jam buka","jb"],["Jam tutup","jt"],["SPD","spd"],["STD","std"],["APC","apc"],["Margin","mg"],["Margin %","mgp"]];
  h+=`<div class="box"><div class="sc"><table><tr><th>Kode</th><th>Nama toko</th><th>Cabang</th><th>Kabupaten</th><th>Supplier ${esc(G().short)}</th><th>PT</th><th>Area cover</th><th>Perubahan</th></tr>`+
  f.slice(0,S.lim).map(t=>{const x=m[t.kd],o=S.open.has(t.kd);return `<tr class="cl${chT(t.kd)?" nw":""}" data-kd="${t.kd}"><td><b>${t.kd}</b></td><td>${esc(t.nm)}<br><small style="color:var(--mut)">${esc(t.al)}</small></td><td>${esc(t.cab)}</td><td>${esc(t.kab)}</td><td>${x?(S.g==="freshmilk"?esc(D.supp[x[0]].nama)+'<br><small style="color:var(--mut)">'+esc(D.supp[x[0]].kode)+" · "+x[0]+"</small>":esc(D.supp[x[0]].kode)+" · "+x[0]):'<span style="color:var(--mut)">–</span>'}</td><td>${x?`<span class="tg ${x[1]==3?"o":"w"}">${x[1]}</span>`:""}</td><td>${x?esc(x[2])+(x[3]?` <span class="tg w">${esc(x[3])}</span>`:""):""}</td><td>${chcell(chT(t.kd))}</td></tr>`+
   (o?`<tr><td colspan="8"><div class="dt">${D2.map(([l,k])=>t[k]!==""&&t[k]!=null?`<div><span>${l}</span>${esc(t[k])}</div>`:"").join("")}${t.lat!=null?`<div><span>Peta</span><a href="https://www.google.com/maps?q=${t.lat},${t.lon}" target="_blank" rel="noopener">Buka Google Maps</a></div>`:""}</div></td></tr>`:"")}).join("")+`</table></div></div>`;
  if(f.length>S.lim)h+=`<button class="more" id="more">Tampilkan lebih banyak (${f.length-S.lim} lagi)</button>`;
  return h+(f.length?"":'<div class="em">Tidak ada toko cocok.</div>');
}
const nbOpen=()=>S.nbo===undefined?innerWidth>1100:S.nbo;
function nbData(g){
  const now=new Date(),m=D.map[g]||{},by={};
  Object.entries(CH.toko[g]||{}).forEach(([kd,c])=>{
    if(!/spreadsheet GO/i.test(c[1]))return;
    const d=pb(c[0]);if(d&&now-new Date(d[0],d[1]-1,d[2])>14*864e5)return;
    if(g==="freshmilk"&&!m[kd])return;
    by[kd]={kd,d:c[0],k:d?d[0]*10000+d[1]*100+d[2]:0,n:c[1].split("; ")};
  });
  return{rows:Object.values(by).sort((x,y)=>y.k-x.k||x.kd.localeCompare(y.kd)),fm:g==="freshmilk"?FMCHK.slice():[]};
}
function newBox(){
  const open=nbOpen(),g=S.g,m=D.map[g]||{},T={};D.toko.forEach(t=>T[t.kd]=t);
  const gn=x=>(D.groups.find(y=>y.id===x)||{}).short||x,cnt=x=>{const z=nbData(x);return z.rows.length+z.fm.length};
  const bd=(l,c)=>`<span class="tg ${c}" style="margin:0 4px 2px 0">${l}</span>`;
  const kind=n=>{const o=[];if(n.some(x=>/^Toko baru/.test(x)))o.push(["TOKO BARU","nw"]);if(n.some(x=>/^Tipe \d+ →/.test(x)))o.push(["TIPE BERUBAH","w"]);if(n.some(x=>/^GO (mundur|berubah)/.test(x)))o.push(["GO BERUBAH","w"]);if(n.some(x=>/^Ditambahkan ke mapping/.test(x)))o.push(["MAPPING BARU","o"]);return o.length?o:[["UPDATE","o"]]};
  const tp=x=>x?bd("Tipe "+x[1],x[1]==3?"o":"w"):bd("BELUM TERMAPPING","w");
  const z=nbData(g),n=z.rows.length+z.fm.length;
  const head=`<h3 data-nb="1"><span>TOKO BARU <span class="tg nw">${n}</span></span><small>${open?"Sembunyikan":"Tampilkan"}</small></h3>`;
  if(!open)return `<aside class="box nbx nbside">${head}</aside>`;
  const card=r=>{const t=T[r.kd];return `<div class="nbi" data-ngo="${r.kd}"><div>${kind(r.n).map(j=>bd(j[0],j[1])).join("")}</div><div><b>${r.kd}</b> ${esc(t?t.nm:"")}</div><div class="nbm">${esc(t?t.kab:"")} · GO ${esc((t&&t.buka)||"–")} · ${tp(m[r.kd])}</div><div class="nbm">${r.n.map(esc).join("<br>")}</div><div class="nbm">Update ${esc(r.d)}</div></div>`};
  const fcard=kd=>{const t=T[kd],ref={};
    if(t)D.toko.forEach(u=>{const e=m[u.kd];if(e&&u.kab===t.kab&&u.kd!==kd){const k="Tipe "+e[1]+" · "+e[2];ref[k]=(ref[k]||0)+1}});
    const rf=Object.entries(ref).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([k,c])=>k+" ("+c+" toko)").join(", ");
    return `<div class="nbi" data-ngo="${kd}"><div>${bd("PERLU CEK","w")}</div><div><b>${kd}</b> ${esc(t?t.nm:"")}</div><div class="nbm">${esc(t?t.kab:"")} · GO ${esc((t&&t.buka)||"–")} · ${tp(null)}</div><div class="nbm">${esc(FMV[kd]||"Point Coffee / Yummy Coffee Gold")} di spreadsheet GO, belum termapping Fresh Milk<br>${rf?"Acuan "+esc(t.kab)+": "+esc(rf):"Belum ada acuan Fresh Milk di wilayah yang sama"}</div></div>`};
  const chips=["aice","walls","freshmilk"].map(x=>`<button class="chip ${x===g?"on":""}" data-ng="${x}">${esc(gn(x))}<i>${cnt(x)}</i></button>`).join("");
  return `<aside class="box nbx nbside">${head}<div class="nbsub">Update lewat spreadsheet GO, 14 hari terakhir. Mengikuti kelompok item yang dipilih.</div><div class="chips" style="padding:8px 12px 0;margin:0">${chips}</div><div class="nbl">${n?z.rows.map(card).join("")+z.fm.map(fcard).join(""):`<div class="em" style="padding:14px">Tidak ada perubahan ${esc(gn(g))} dari spreadsheet GO.</div>`}</div></aside>`;
}
function render(){head();const a=$("#app"),fo=document.activeElement&&document.activeElement.id==="q";a.innerHTML=`<div class="lay${nbOpen()?"":" nc"}"><div class="lc">${S.tab==="item"?viewItem():S.tab==="sup"?viewSup():viewToko()}</div>${newBox()}</div>`;document.documentElement.style.setProperty("--hh",$("header").offsetHeight+"px");
  if(fo){const q=$("#q");q.focus();q.setSelectionRange(99,99)}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-nb],[data-ngo],[data-ng],[data-t],[data-k],[data-sup],[data-kd],#more");if(!t)return;
  if(t.dataset.nb){S.nbo=!nbOpen()}
  else if(t.dataset.ng){S.g=t.dataset.ng;S.kel="";S.sup="";S.pt="";S.mp="";S.ub="";S.ubah=""}
  else if(t.dataset.ngo){const k=t.dataset.ngo;S.tab="toko";S.q=k;S.sup="";S.pt="";S.cab="";S.kab="";S.mp="";S.ub="";S.lim=100;S.open.add(k)}
  else if(t.dataset.t){S.tab=t.dataset.t;S.q="";S.lim=100}
  else if(t.dataset.k){S[t.dataset.k]=(t.dataset.tog&&S[t.dataset.k]===t.dataset.v)?"":t.dataset.v}
  else if(t.dataset.sup){S.tab="toko";S.sup=t.dataset.sup;S.pt="";S.cab="";S.kab="";S.mp="";S.q="";S.lim=100}
  else if(t.dataset.kd){const k=t.dataset.kd;S.open.has(k)?S.open.delete(k):S.open.add(k)}
  else if(t.id==="more"){S.lim+=200}
  render()});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S.lim=100;render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="grp"){S.g=t.value;S.kel="";S.sup="";S.pt="";S.mp="";S.ub="";S.ubah=""}else if(t.dataset.s){S[t.dataset.s]=t.value;S.lim=100}else return;render()});
/* ===== Sinkron otomatis dari Google Spreadsheet GO (hanya baca) ===== */
const SSID="1dsqnV-tKBkHfbEXzWVusR0RrE7l4hgTeAdhfjIT5aS4";
const BLN={JANUARI:0,JANUARY:0,FEBRUARI:1,MARET:2,APRIL:3,MEI:4,JUNI:5,JULI:6,AGUSTUS:7,SEPTEMBER:8,OKTOBER:9,NOVEMBER:10,DESEMBER:11};
const BLNN=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nmh=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const pd=s=>{const m=String(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?[+m[3],+m[2],+m[1]]:null};
const pb=s=>{const m=String(s||"").match(/(\d{1,2}) (\w{3}) (\d{4})/);return m?[+m[3],EN.indexOf(m[2])+1,+m[1]]:null};
const fd=a=>String(a[2]).padStart(2,"0")+" "+EN[a[1]-1]+" "+a[0];
const same=(a,b)=>!!a&&!!b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
const tc=s=>String(s||"").trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const dms=s=>{const m=String(s||"").match(/(\d+)\D+(\d+)\D+([\d.]+)\D+([NSU])\s*(\d+)\D+(\d+)\D+([\d.]+)\D+([EWTB])/i);
  if(!m)return null;const a=+m[1]+m[2]/60+m[3]/3600,b=+m[5]+m[6]/60+m[7]/3600;
  return[Math.round((/S/i.test(m[4])?-a:a)*1e5)/1e5,Math.round((/[WB]/i.test(m[8])?-b:b)*1e5)/1e5]};
const sc=(t,g)=>{t=String(t||"");const m=t.match(/\b(\d{5})\b/);if(m)return m[1];
  if(g==="walls"){if(/BTG/i.test(t))return"35328";if(/SMD|SAMARINDA/i.test(t))return"27147";if(/YAKIN|YBS/i.test(t))return"53481"}return null};
const mk=(g,k,d,t)=>{const o=CH.toko[g]=CH.toko[g]||{},e=o[k];o[k]=(e&&e[0]===d&&!e[1].split("; ").includes(t))?[d,e[1]+"; "+t]:[d,t]};
/* Data dasar = 647 toko dari Excel. Tiap sinkron dimulai dari data dasar, jadi toko yang dihapus di spreadsheet ikut hilang. */
const BASE={toko:JSON.parse(JSON.stringify(D.toko)),map:JSON.parse(JSON.stringify(D.map)),ch:JSON.parse(JSON.stringify(CH.toko))};
const BKD=new Set(D.toko.map(t=>t.kd));
function resetBase(){D.toko=JSON.parse(JSON.stringify(BASE.toko));D.map=JSON.parse(JSON.stringify(BASE.map));CH.toko=JSON.parse(JSON.stringify(BASE.ch))}
function mergeRows(v,today,fm,recent){
  let H=null,n=0,nw=0;
  const col=(r,...ks)=>{for(const k of ks){if(H[k]!=null)return String(r[H[k]]==null?"":r[H[k]]).trim()}return""};
  for(const r of v){
    if(!Array.isArray(r))continue;
    if(r.some(c=>nmh(c)==="KDTK")){H={};r.forEach((c,i)=>{const k=nmh(c);if(k&&!(k in H))H[k]=i});continue}
    if(!H)continue;
    const kd=col(r,"KDTK").toUpperCase();if(!/^[A-Z0-9]{4}$/.test(kd))continue;
    if(BKD.has(kd)&&!recent)continue;
    let tk=D.toko.find(x=>x.kd===kd);
    if(!tk){
      tk={kd,nm:col(r,"NAMA TOKO","NMTK"),cab:tc(col(r,"CABANG")),gd:col(r,"KODE GUDANG"),buka:"",as:col(r,"AS"),am:col(r,"AM"),spd:"",std:"",apc:"",mg:"",mgp:"",al:"",kel:"",kec:tc(col(r,"KEC")),kab:tc(col(r,"KAB KOTA")),pos:"",jarak:"",dom:"",sub:"",soc:"",mx:"",tp:"",h24:"",jb:"",jt:"",lat:null,lon:null};
      D.toko.push(tk);n++;nw++;
      ["aice","walls","freshmilk"].forEach(g=>mk(g,kd,today,"Toko baru dari spreadsheet GO"));
    }
    const gd=pd(col(r,"TGL GO"));
    if(gd){const old=pb(tk.buka);if(!same(old,gd)){const t2=fd(gd);
      if(tk.buka)["aice","walls","freshmilk"].forEach(g=>mk(g,kd,today,"GO berubah: "+tk.buka+" \u2192 "+t2+" (spreadsheet GO)"));
      tk.buka=t2;n++}}
    if(tk.lat==null){const c=dms(col(r,"TITIK KORDINAT GMAPS"));if(c){tk.lat=c[0];tk.lon=c[1]}}
    for(const [g,sk,ty] of [["aice","AICE","TIPE HARGA AICE"],["walls","WALLS","TIPE HARGA WALLS"]]){
      const sup=sc(col(r,sk,"WALL S"),g),t=parseInt(col(r,ty),10);
      if(!sup||!(t>0))continue;
      const e=D.map[g][kd];
      if(e&&e[0]===sup&&e[1]===t&&e[3]!=="Usulan")continue;
      const ne=[sup,t,e?e[2]:(tk.kab||tc(col(r,"KAB KOTA")))];
      if(e&&e[3]&&e[3]!=="Usulan")ne.push(e[3]);
      D.map[g][kd]=ne;n++;
      mk(g,kd,today,e?("Tipe "+e[1]+" \u2192 "+t+(sup!==e[0]?" (supplier "+e[0]+" \u2192 "+sup+")":"")+" (dari spreadsheet GO)"):("Ditambahkan ke mapping dari spreadsheet GO, tipe "+t));
    }
    {const mv=col(r,"MODIS COFFEE","TOKO SUDAH GO");if(recent&&/POINT COFFEE|YUMMY COFFEE/i.test(mv)&&!D.map.freshmilk[kd]&&!fm.includes(kd)){fm.push(kd);FMV[kd]=mv}}
  }
  return[n,nw];
}
async function syncGO(){
  if(SYNC.busy||!MCP)return;SYNC.busy=true;SYNC.msg="Sinkron spreadsheet GO\u2026";render();
  const now=new Date(),today=fd([now.getFullYear(),now.getMonth()+1,now.getDate()]),cur=now.getFullYear()*12+now.getMonth();
  const AUTH=/needs_reauth|server_not_connected|not_in_manifest|approval_required|consent_required|not_granted|selection_required|blocked_by_policy/;
  let code="",titles=[];
  try{
    const r=await MCP.callTool("Google Sheets","get_spreadsheet",{spreadsheetId:SSID,fields:["sheets.properties.title"]},{cache:{refresh:true}});
    const p=r&&r.payload,sh=(p&&p.sheets)||(p&&p.content&&p.content.sheets)||[];
    titles=sh.map(s=>s&&s.properties&&s.properties.title).filter(Boolean);
  }catch(e){code=(e&&e.code)||"error"}
  let tabs=titles.map(t=>{const m=String(t).trim().match(/^TOKO BARU (\w+) (\d{4}) PERISH$/i);const b=m&&BLN[m[1].toUpperCase()];return m&&b!=null?{t,k:+m[2]*12+b}:null}).filter(Boolean);
  if(!tabs.length&&!AUTH.test(code))tabs=[-1,0,1].map(o=>{const d=new Date(now.getFullYear(),now.getMonth()+o,1);return{t:"TOKO BARU "+BLNN[d.getMonth()]+" "+d.getFullYear()+" PERISH",k:d.getFullYear()*12+d.getMonth()}});
  const res=[];
  if(!AUTH.test(code))for(let i=0;i<tabs.length;i+=4){
    await Promise.all(tabs.slice(i,i+4).map(async tb=>{
      try{
        const r=await MCP.callTool("Google Sheets","get_values",{spreadsheetId:SSID,range:"'"+tb.t+"'!A1:V250"},{cache:{refresh:true}});
        const v=r&&r.payload&&r.payload.values;if(Array.isArray(v))res.push({k:tb.k,v});
      }catch(e){const c=e&&e.code;if(c&&c!=="tool_error"&&c!=="bad_request")code=c}
    }));
  }
  SYNC.busy=false;
  const tm=now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  if(res.length){
    resetBase();res.sort((a,b)=>a.k-b.k);let n=0,nw=0;const fm=[];
    res.forEach(x=>{const z=mergeRows(x.v,today,fm,Math.abs(x.k-cur)<=1);n+=z[0];nw+=z[1]});FMCHK=fm.slice();
    SYNC.msg="Sinkron spreadsheet GO "+tm+" ("+res.length+" tab): "+(nw?nw+" toko baru dari spreadsheet":"tidak ada toko baru")+(n-nw?", "+(n-nw)+" perubahan mapping atau tanggal":"")+(fm.length?" \u00b7 Point Coffee/Yummy Coffee Gold belum termapping Fresh Milk: "+fm.join(", "):"");
  }
  else if(AUTH.test(code))SYNC.msg="Google Sheets belum tersambung atau belum diizinkan di akun ini, memakai data tersimpan";
  else SYNC.msg=code?"Sinkron spreadsheet GO gagal, memakai data tersimpan":"Tab toko baru tidak ditemukan di spreadsheet, memakai data tersimpan";
  render();
}
document.addEventListener("click",e=>{if(e.target.id==="rsync")syncGO()});

render();
(window.claude&&window.claude.use?window.claude.use("mcp"):Promise.resolve(null)).then(m=>{MCP=m;if(m)syncGO();else{SYNC.msg="Sinkron otomatis spreadsheet GO belum aktif di tampilan ini, memakai data tersimpan";render()}}).catch(()=>{});
</script></body></html>
